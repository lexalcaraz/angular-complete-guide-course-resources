<div>
    <button (click)="onSelectUser()">
        <img 
        [src]="imagePath" 
        [alt]="selectedUser.name"
        />
        <span>{{ selectedUser.name }}</span>
    </button>
</div>

<!-- String interpolation: {{ selectedUser.name }} - in Angular is a data-binding technique that lets you embed expressions or component property values directly into your HTML template.-->
<!-- Property binding: [src] - in Angular is a one-way data binding technique that allows you to bind values from your component's properties directly to the properties of HTML elements, Angular components, or directives.-->
